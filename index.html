<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سامانه استعلام سکه مسروری</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Vazirmatn,tahoma;
background:#f6f3ed;
color:#222;
}


/* هدر */

.header{
background:#111;
padding:45px 20px;
text-align:center;
color:#d4af37;
}

.header h1{
font-size:34px;
margin:0;
}

.header p{
color:#eee;
font-size:18px;
margin-top:20px;
}


/* بخش اصلی */

.container{
max-width:600px;
margin:-30px auto 40px;
background:white;
border-radius:35px;
padding:40px 25px;
box-shadow:0 10px 40px #0002;
text-align:center;
}

h2{
font-size:32px;
margin-bottom:15px;
}


.input{
width:100%;
height:70px;
border:3px solid #222;
border-radius:25px;
font-size:20px;
text-align:center;
outline:none;
}


button{
margin-top:25px;
width:230px;
height:65px;
border:0;
border-radius:40px;
background:#d4af37;
color:white;
font-size:22px;
cursor:pointer;
}


/* کارت نتیجه */

.result{

margin-top:50px;
background:#111;
border-radius:30px;
padding:35px 25px;
color:white;
border:3px solid #d4af37;
box-shadow:0 0 35px #d4af3780;
}


.ok{
font-size:32px;
color:#d4af37;
font-weight:800;
margin-bottom:30px;
}


.info{
background:#1c1c1c;
border:1px solid #d4af37;
border-radius:18px;
padding:15px;
margin:15px 0;
font-size:19px;
}


.footer{
margin-top:30px;
font-size:14px;
color:#aaa;
}


</style>

</head>


<body>


<div class="header">

<h1>بورس سکه مسروری</h1>

<p>سامانه رسمی استعلام اصالت سکه</p>

</div>



<div class="container">


<h2>استعلام سکه</h2>

<p>شماره سریال کارت را وارد کنید</p>


<input class="input" value="MSR-34236539">


<button>
بررسی اصالت
</button>



<div class="result">

<div class="ok">
✓ اصالت تأیید شد
</div>


<div class="info">
نوع سکه: نیم سکه عادی
</div>


<div class="info">
عیار: ۹۰۰
</div>


<div class="info">
وزن: ۴.۰۶۴ گرم
</div>


<div class="info">
شماره سریال:
MSR-34236539
</div>


<div class="info">
صادر کننده:
بورس سکه مسروری
</div>


<div class="footer">
این کارت توسط سامانه رسمی بورس سکه مسروری تأیید شده است
</div>


</div>



</div>


</body>
</html>
