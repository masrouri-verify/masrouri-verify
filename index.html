<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استعلام اصالت سکه | مسروری</title>
<style>
body{margin:0;background:#101827;color:#fff;font-family:Tahoma,Arial,sans-serif;text-align:center;padding:20px}
.card{max-width:440px;margin:35px auto;background:#1b2638;border:1px solid #c6a45b;border-radius:18px;padding:25px 18px;box-sizing:border-box}
.logo{font-size:38px;color:#d9b765;font-weight:bold}
h1{font-size:22px;color:#e3c477}
p{line-height:2;color:#ddd}
input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:9px;font-size:16px}
input{border:1px solid #b99b53;background:#101827;color:white;text-align:center;direction:ltr}
button{background:#d9b765;color:#101827;border:0;font-weight:bold;cursor:pointer}
#result{margin-top:20px;text-align:right;line-height:2.3}
.ok{color:#77e0a1}.bad{color:#ff9292}
small{color:#bbb}
</style>
</head>
<body>
<div class="card">
  <div class="logo">M</div>
  <h1>بورس سکه مسروری</h1>
  <p>سامانه استعلام مشخصات سکه</p>

  <input id="serial" placeholder="مثال: MSR-000001" autocomplete="off">
  <button onclick="checkCoin()">بررسی اصالت</button>
  <div id="result"></div>
  <p><small>سامانه استعلام مشخصات ثبت‌شده</small></p>
</div>

<script>
const coins = {
 "MSR-000001": {type:"تمام سکه بانکی",karat:"۹۰۰",weight:"۸.۱۳۳ گرم"},
 "MSR-000002": {type:"نیم سکه بانکی",karat:"۹۰۰",weight:"۴.۰۶۶ گرم"},
 "MSR-000003": {type:"ربع سکه بانکی",karat:"۹۰۰",weight:"۲.۰۳۲ گرم"},
 "MSR-000004": {type:"تمام سکه عادی",karat:"۹۰۰",weight:"۸.۱۳۳ گرم"},
 "MSR-000005": {type:"نیم سکه عادی",karat:"۹۰۰",weight:"۴.۰۶۶ گرم"},
 "MSR-000006": {type:"ربع سکه عادی",karat:"۹۰۰",weight:"۲.۰۳۲ گرم"}
};

function checkCoin(){
 const code=document.getElementById("serial").value.trim().toUpperCase();
 const c=coins[code];
 const r=document.getElementById("result");

 if(!c){
  r.innerHTML='<p class="bad">❌ این کد در فهرست کدهای تعریف‌شده پیدا نشد.</p>';
  return;
 }

 r.innerHTML=`
 <h3 class="ok">✅ کد در سامانه ثبت شده است</h3>
 <p><b>نام مجموعه:</b> بورس سکه مسروری</p>
 <p><b>شماره سریال:</b> ${code}</p>
 <p><b>نوع سکه:</b> ${c.type}</p>
 <p><b>عیار ثبت‌شده:</b> ${c.karat}</p>
 <p><b>وزن ثبت‌شده:</b> ${c.weight}</p>
 <p><small>توجه: نمایش این اطلاعات به‌تنهایی تأیید فیزیکی اصالت سکه نیست.</small></p>`;
}

document.getElementById("serial").addEventListener("keydown",e=>{
 if(e.key==="Enter") checkCoin();
});

const code=new URLSearchParams(location.search).get("code");
if(code){
 document.getElementById("serial").value=code;
 checkCoin();
}
</script>
</body>
</html>
