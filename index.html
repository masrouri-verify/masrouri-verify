<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بورس سکه مسروری</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Vazirmatn;
}

body{
margin:0;
background:#0d0d0d;
color:white;
}


.logo-wrapper{
text-align:center;
margin-top:30px;
}


.gold-logo{

width:100px;
height:100px;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(145deg,#f5d76e,#b8860b);

border:4px solid #fff0a8;

font-size:60px;
font-weight:900;
color:#111;

box-shadow:0 0 25px #d4af37;

}


.header{

text-align:center;
padding:20px;

}


.header h1{

color:#d4af37;

}


.container{

max-width:450px;
margin:auto;

background:#191919;

padding:25px;

border-radius:20px;

}


h2{

text-align:center;
color:#d4af37;

}


input{

width:100%;

padding:15px;

border-radius:10px;

border:none;

font-size:16px;

margin:10px 0;

}


button{

width:100%;

padding:15px;

border-radius:10px;

border:none;

background:#d4af37;

font-size:18px;

font-weight:bold;

}


.result{

margin-top:20px;

background:#222;

padding:15px;

border-radius:15px;

}


.item{

padding:10px;

border-bottom:1px solid #444;

}


.footer{

margin-top:30px;

text-align:center;

color:#ccc;

line-height:2;

font-size:14px;

}


</style>

</head>


<body>


<div class="logo-wrapper">

<div class="gold-logo">
M
</div>

</div>



<div class="header">

<h1>
بورس سکه مسروری
</h1>

<p>
سامانه رسمی استعلام اصالت سکه
</p>

</div>



<div class="container">


<h2>
استعلام سکه
</h2>


<label>
شماره سریال پلمپ را وارد کنید
</label>


<input id="codeInput" placeholder="مثال : MSR-000001">


<button onclick="checkCoin()">
بررسی اصالت
</button>



<div id="result" class="result" style="display:none">

</div>



<div class="footer">

بورس سکه مسروری

<br>

آدرس:
چهارمحال و بختیاری،
شهرستان بروجن،
خیابان طالقانی میانی،
نرسیده به بانک ملت

<br>

تلفن:
۰۳۸-۳۴۲۳۶۵۳۹

</div>


</div>





<script>


const coins={


"MSR-000001":{
type:"تمام سکه بانکی",
karat:"۹۰۰",
weight:"۸.۱۳۳ گرم"
},


"MSR-000002":{
type:"نیم سکه بانکی",
karat:"۹۰۰",
weight:"۴.۰۶۶ گرم"
},


"MSR-000003":{
type:"ربع سکه بانکی",
karat:"۹۰۰",
weight:"۲.۰۳۲ گرم"
},


"MSR-000004":{
type:"تمام سکه عادی",
karat:"۹۰۰",
weight:"۸.۱۳۳ گرم"
},


"MSR-000005":{
type:"نیم سکه عادی",
karat:"۹۰۰",
weight:"۴.۰۶۶ گرم"
},


"MSR-000006":{
type:"ربع سکه عادی",
karat:"۹۰۰",
weight:"۲.۰۳۲ گرم"
}


};



function checkCoin(){


let code=document.getElementById("codeInput").value.trim();

let result=document.getElementById("result");



if(coins[code]){


let coin=coins[code];


result.style.display="block";


result.innerHTML=`

<h3 style="color:#00ff88">
✓ اصالت تایید شد
</h3>

<div class="item">
نوع سکه: ${coin.type}
</div>

<div class="item">
عیار: ${coin.karat}
</div>

<div class="item">
وزن: ${coin.weight}
</div>

<div class="item">
کد اصالت: ${code}
</div>

<div class="item">
برند: بورس سکه مسروری
</div>

`;

}


else{


result.style.display="block";


result.innerHTML=`

<h3 style="color:red">
✕ سکه یافت نشد
</h3>

<div class="item">
این کد در سامانه ثبت نشده است
</div>

`;

}


}


</script>


</body>

</html>
