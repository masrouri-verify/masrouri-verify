<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سامانه استعلام سکه مسروری</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Vazirmatn,tahoma;
background:#f5f3ee;
color:#222;
}

.header{
background:#111;
padding:45px 20px;
text-align:center;
border-bottom:3px solid #d4af37;
}

.header h1{
color:#d4af37;
font-size:38px;
margin:0 0 15px;
font-weight:900;
}

.header p{
color:white;
font-size:20px;
}


.container{
max-width:600px;
margin:-20px auto 40px;
background:white;
border-radius:35px;
padding:35px 25px;
box-shadow:0 15px 40px #0002;
}


h2{
text-align:center;
font-size:34px;
margin-bottom:20px;
}


label{
display:block;
text-align:center;
font-size:20px;
margin-bottom:15px;
}


input{
width:100%;
padding:20px;
border-radius:25px;
border:2px solid #222;
font-size:20px;
text-align:center;
}


button{
width:70%;
display:block;
margin:25px auto;
padding:18px;
border:0;
border-radius:30px;
background:#d4af37;
font-size:22px;
color:white;
cursor:pointer;
}


.result{
background:#111;
color:white;
border:3px solid #d4af37;
border-radius:30px;
padding:30px;
text-align:center;
box-shadow:0 0 30px #d4af3766;
}


.result h3{
color:#d4af37;
font-size:30px;
}


.item{
background:#1c1c1c;
border:1px solid #d4af37;
border-radius:18px;
padding:15px;
margin:15px 0;
font-size:20px;
}


.footer{
text-align:center;
margin-top:30px;
color:#777;
}

.logo-wrapper{
    display:flex;
    justify-content:center;
    margin:25px 0 -10px; 
}

.gold-logo{
    width:85px;
    height:85px;
    border-radius:50%;
    background:linear-gradient(145deg,#111,#222);
    border:3px solid #d4af37;
    color:#d4af37;
    font-size:55px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:serif;
    box-shadow:0 0 25px rgba(212,175,55,.7);
    position:relative;
}

.gold-logo::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:1px solid #d4af37;
}
</style>

</head>


<body>
<div class="logo-wrapper">
  <div class="gold-logo">M</div>
</div>

<div class="header">

<h1>بورس سکه مسروری</h1>

<p>سامانه رسمی استعلام اصالت سکه</p>

</div>


<div class="container">


<h2>استعلام سکه</h2>


<label>شماره سریال کارت را وارد کنید</label>


<input placeholder="مثال : MSR-34236539">


<button>بررسی اصالت</button>


<div class="result">


<h3>✓ اصالت تایید شد</h3>


<div class="item">
نوع سکه: نیم سکه عادی
</div>


<div class="item">
عیار: ۹۰۰
</div>


<div class="item">
وزن: ۴.۰۶۴ گرم
</div>


<div class="item">
شماره سریال: MSR-34236539
</div>


</div>


<div class="footer">
بورس سکه مسروری
</div>


</div>


</body>
</html>
