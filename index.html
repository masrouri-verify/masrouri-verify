<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بورس سکه مسروری</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');


*{
box-sizing:border-box;
font-family:Vazirmatn;
}


body{

margin:0;

min-height:100vh;

background:
radial-gradient(circle at top,#3b2a05,#050505 60%);

color:white;

}



/* لوگوی سکه */

.logo-box{

display:flex;

justify-content:center;

padding-top:35px;

}



.logo{

width:130px;

height:130px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;


background:

linear-gradient(

145deg,

#fff3a6,

#d4af37,

#8b6508

);


border:6px solid #ffe89a;


box-shadow:

0 0 40px #d4af37,

inset 0 0 20px #5c4000;


position:relative;

animation: glow 3s infinite;

}



.logo::before{

content:"";

position:absolute;

width:105px;

height:105px;

border-radius:50%;

border:2px dashed #fff2a8;

}



.logo span{

font-size:70px;

font-weight:900;

color:#241900;

z-index:2;

text-shadow:1px 1px #fff;

}



@keyframes glow{

50%{

box-shadow:

0 0 60px #d4af37,

inset 0 0 25px #5c4000;

}

}



/* هدر */


.header{

text-align:center;

padding:20px;

}


.header h1{

font-size:32px;

color:#d4af37;

margin:10px;

}



.header p{

color:#ddd;

}



/* کارت اصلی */


.container{

max-width:460px;

margin:auto;

padding:25px;


background:

rgba(255,255,255,.07);


border:

1px solid rgba(212,175,55,.5);


border-radius:30px;


backdrop-filter:blur(12px);


box-shadow:

0 0 35px rgba(0,0,0,.5);


}



h2{

text-align:center;

color:#f5d76e;

}label{

display:block;

margin-bottom:10px;

color:#eee;

}



input{

width:100%;

padding:16px;

border-radius:15px;

border:none;

outline:none;

font-size:17px;

text-align:center;

margin-bottom:15px;

}



button{

width:100%;

padding:17px;

border-radius:15px;

border:none;


background:

linear-gradient(

90deg,

#8b6508,

#f5d76e,

#8b6508

);


font-size:18px;

font-weight:900;

cursor:pointer;


box-shadow:

0 0 20px rgba(212,175,55,.5);

}



button:hover{

transform:scale(1.03);

}




.result{

margin-top:25px;

padding:20px;

background:#111;

border-radius:20px;

border:1px solid #d4af37;

}



.success{

text-align:center;

color:#00ff88;

font-size:22px;

font-weight:900;

}



.item{

padding:13px;

border-bottom:1px solid #333;

font-size:16px;

}



.footer{

max-width:460px;

margin:30px auto;

text-align:center;

line-height:2;

color:#ccc;

font-size:14px;

}



.gold{

color:#d4af37;

font-weight:900;

}



</style>

</head>


<body>


<div class="logo-box">

<div class="logo">

<span>M</span>

</div>

</div>



<div class="header">

<h1>
بورس سکه مسروری
</h1>

<p>
سامانه هوشمند استعلام اصالت سکه
</p>

</div>



<div class="container">


<h2>
🪙 استعلام اصالت سکه
</h2>


<label>
شماره سریال پلمپ را وارد کنید
</label>


<input id="codeInput" placeholder="MSR-000001">


<button onclick="checkCoin()">

بررسی اصالت

</button>


<div id="result" class="result" style="display:none">

</div>


</div>



<div class="footer">


<div class="gold">

بورس سکه مسروری

</div>


آدرس:

<br>

چهارمحال و بختیاری

<br>

شهرستان بروجن

<br>

خیابان طالقانی میانی

<br>

نرسیده به بانک ملت


<br><br>


تلفن:

<br>

۰۳۸-۳۴۲۳۶۵۳۹


</div>



<script>


const coins={


"MSR-000001":{

type:"تمام سکه بانکی",

weight:"۸.۱۳۳ گرم"

},


"MSR-000002":{

type:"نیم سکه بانکی",

weight:"۴.۰۶۶ گرم"

},


"MSR-000003":{

type:"ربع سکه بانکی",

weight:"۲.۰۳۲ گرم"

},


"MSR-000004":{

type:"تمام سکه عادی",

weight:"۸.۱۳۳ گرم"

},


"MSR-000005":{

type:"نیم سکه عادی",

weight:"۴.۰۶۶ گرم"

},


"MSR-000006":{

type:"ربع سکه عادی",

weight:"۲.۰۳۲ گرم"

}


};function checkCoin(){


let code = document
.getElementById("codeInput")
.value
.trim()
.toUpperCase();


let result = document
.getElementById("result");



if(coins[code]){


let coin = coins[code];


result.style.display="block";


result.innerHTML = `


<div class="success">

✓ اصالت تایید شد

</div>



<div class="item">

نوع سکه:
${coin.type}

</div>



<div class="item">

عیار:
۹۰۰

</div>



<div class="item">

وزن:
${coin.weight}

</div>



<div class="item">

شماره سریال:
${code}

</div>



<div class="item">

برند:
بورس سکه مسروری

</div>


`;



}

else{


result.style.display="block";


result.innerHTML = `


<div style="color:red;text-align:center;font-size:20px;font-weight:bold">

✕ سکه یافت نشد

</div>



<div class="item">

این کد در سامانه ثبت نشده است

</div>


`;

}


}



// خواندن خودکار QR

const urlParams = new URLSearchParams(window.location.search);

const qr = urlParams.get("code");


if(qr){

document.getElementById("codeInput").value = qr;

checkCoin();

}



</script>


</body>

</html>
