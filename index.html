<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بورس سکه مسروری | استعلام اصالت</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap');


*{
box-sizing:border-box;
font-family:Vazirmatn;
}


body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle at top,#2b2208,#050505 55%);

color:white;

}



.logo-area{

text-align:center;

padding-top:35px;

}



.coin-logo{

width:120px;
height:120px;

margin:auto;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

position:relative;


background:
linear-gradient(145deg,#fff0a8,#d4af37,#8a6500);


border:5px solid #ffe89c;


box-shadow:

0 0 35px rgba(212,175,55,.8),

inset 0 0 20px rgba(0,0,0,.5);


}


.coin-logo span{

font-size:65px;

font-weight:900;

color:#3d2b00;

text-shadow:1px 1px #fff;

}



.coin-logo:after{

content:"";

position:absolute;

width:95px;

height:95px;

border-radius:50%;

border:2px dashed #fff1a8;

}



.header{

text-align:center;

padding:20px;

}


.header h1{

margin:5px;

font-size:30px;

color:#d4af37;

}



.header p{

color:#ddd;

}



.card{

max-width:450px;

margin:20px auto;

padding:25px;


background:

rgba(255,255,255,.06);


border:1px solid rgba(212,175,55,.5);


border-radius:25px;


box-shadow:

0 0 25px rgba(0,0,0,.5);


backdrop-filter:blur(10px);


}



h2{

text-align:center;

color:#d4af37;

}



label{

display:block;

margin-bottom:8px;

}


input{


width:100%;

padding:16px;

border-radius:12px;

border:none;

font-size:16px;

text-align:center;


}



button{


width:100%;

margin-top:15px;

padding:16px;

border-radius:12px;

border:none;


background:

linear-gradient(90deg,#b8860b,#f5d76e,#b8860b);


font-size:18px;

font-weight:900;

cursor:pointer;


}.result{

margin-top:25px;

padding:20px;

border-radius:18px;


background:#111;

border:1px solid #d4af37;


}



.success{

color:#00ff88;

font-size:20px;

font-weight:900;

text-align:center;

}



.item{

padding:12px;

border-bottom:1px solid #333;

}



.footer{

max-width:450px;

margin:30px auto;

text-align:center;

line-height:2.2;

color:#ccc;

font-size:14px;

padding:20px;

}



.gold{

color:#d4af37;

font-weight:800;

}



</style>

</head>


<body>


<div class="logo-area">

<div class="coin-logo">

<span>M</span>

</div>

</div>



<div class="header">

<h1>
بورس سکه مسروری
</h1>

<p>
سامانه رسمی استعلام اصالت سکه
</p>

</div>



<div class="card">


<h2>
استعلام اصالت سکه
</h2>


<label>
شماره سریال پلمپ
</label>


<input 
id="codeInput"
placeholder="MSR-000001">



<button onclick="checkCoin()">

بررسی اصالت

</button>



<div id="result" class="result" style="display:none">

</div>



</div>



<div class="footer">

<div class="gold">
بورس سکه مسروری
</div>


آدرس:

<br>

چهارمحال و بختیاری

<br>

شهرستان بروجن

<br>

خیابان طالقانی میانی

<br>

نرسیده به بانک ملت


<br><br>


تلفن:

<br>

۰۳۸-۳۴۲۳۶۵۳۹


</div>



<script>


const coins={


"MSR-000001":{

type:"تمام سکه بانکی",

karat:"۹۰۰",

weight:"۸.۱۳۳ گرم"

},



"MSR-000002":{

type:"نیم سکه بانکی",

karat:"۹۰۰",

weight:"۴.۰۶۶ گرم"

},



"MSR-000003":{

type:"ربع سکه بانکی",

karat:"۹۰۰",

weight:"۲.۰۳۲ گرم"

},



"MSR-000004":{

type:"تمام سکه عادی",

karat:"۹۰۰",

weight:"۸.۱۳۳ گرم"

},



"MSR-000005":{

type:"نیم سکه عادی",

karat:"۹۰۰",

weight:"۴.۰۶۶ گرم"

},



"MSR-000006":{

type:"ربع سکه عادی",

karat:"۹۰۰",

weight:"۲.۰۳۲ گرم"

}


};



function checkCoin(){


let code=document
.getElementById("codeInput")
.value
.trim()
.toUpperCase();


let result=document
.getElementById("result");



if(coins[code]){


let coin=coins[code];


result.style.display="block";


result.innerHTML=`

<div class="success">

✓ اصالت تایید شد

</div>


<div class="item">

نوع سکه: ${coin.type}

</div>


<div class="item">

عیار: ${coin.karat}

</div>


<div class="item">

وزن: ${coin.weight}

</div>


<div class="item">

کد اصالت: ${code}

</div>


<div class="item">

برند: بورس سکه مسروری

</div>

`;



}


else{


result.style.display="block";


result.innerHTML=`

<div style="color:red;text-align:center;font-weight:bold">

✕ سکه یافت نشد

</div>


<div class="item">

این کد در سامانه ثبت نشده است

</div>

`;

}


  }
// فعال شدن خودکار از طریق QR Code
const params = new URLSearchParams(window.location.search);

const qrCode = params.get("code");


if(qrCode){

document.getElementById("codeInput").value = qrCode.toUpperCase();

checkCoin();

}


</script>


</body>

</html>
