<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بورس سکه مسروری</title>

<style>
body{
    margin:0;
    font-family:tahoma, sans-serif;
    background:#ffffff;
    color:#222;
}
.header{
    background:#f8f8f8;
    padding:30px;
    text-align:center;
    border-bottom:3px solid #d4af37;
}
h1{
    color:#b8860b;
    font-size:32px;
}
.box{
    margin:25px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px #ddd;
    text-align:center;
}
.coins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}
.coin{
    width:140px;
    height:140px;
    border-radius:50%;
    background:linear-gradient(#ffd700,#b8860b);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    font-size:20px;
}
.footer{
    background:#222;
    color:white;
    padding:20px;
    text-align:center;
}
</style>

</head>

<body>

<div class="header">
<h1>بورس سکه مسروری</h1>
<p>استعلام و تایید اصالت سکه</p>
</div>

<div class="box">
<h2>انواع سکه</h2>

<div class="coins">

<div class="coin">ربع<br>عادی</div>
<div class="coin">نیم<br>عادی</div>
<div class="coin">تمام<br>عادی</div>

<div class="coin">ربع<br>بانکی</div>
<div class="coin">نیم<br>بانکی</div>
<div class="coin">تمام<br>بانکی</div>

</div>
</div>


<div class="box">
<h2>اطلاعات تماس</h2>

<p>
چهارمحال بختیاری، شهرستان بروجن<br>
خیابان طالقانی میانی، نرسیده به بانک ملت
</p>

<p>
تلفن: ۰۳۸-۳۴۲۳۶۵۳۹
</p>

</div>


<div class="footer">
بورس سکه مسروری
</div>

</body>
</html>
