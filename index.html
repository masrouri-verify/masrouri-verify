<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بورس سکه مسروری</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Vazirmatn;
}

body{
margin:0;
background:#111;
color:white;
}

.logo-wrapper{
text-align:center;
margin-top:30px;
}

.gold-logo{
width:90px;
height:90px;
border-radius:50%;
border:2px solid #d4af37;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:50px;
font-weight:900;
color:#d4af37;
}

.header{
text-align:center;
padding:20px;
}

.header h1{
color:#d4af37;
}

.container{
max-width:450px;
margin:auto;
background:#1b1b1b;
padding:25px;
border-radius:20px;
}

h2{
text-align:center;
color:#d4af37;
}

label{
display:block;
margin-bottom:10px;
}

input{
width:100%;
padding:15px;
border-radius:10px;
border:none;
margin-bottom:15px;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#d4af37;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:20px;
background:#222;
padding:15px;
border-radius:15px;
}

.item{
padding:10px;
border-bottom:1px solid #444;
}

.footer{
text-align:center;
margin-top:30px;
color:#aaa;
}

</style>

</head>


<body>


<div class="logo-wrapper">
<div class="gold-logo">M</div>
</div>


<div class="header">

<h1>بورس سکه مسروری</h1>

<p>سامانه رسمی استعلام اصالت سکه</p>

</div>


<div class="container">


<h2>استعلام سکه</h2>


<label>
شماره سریال پلمپ را وارد کنید
</label>


<input id="codeInput" placeholder="مثال : MSR-000001">


<button onclick="checkCoin()">
بررسی اصالت
</button>


<div class="result" id="result" style="display:none"></div>


<div class="footer">
بورس سکه مسروری
</div>


</div>



<script>


const coins = {


"MSR-000001":{
type:"تمام سکه عادی",
karat:"۹۰۰",
weight:"۸.۱۳۳ گرم"
},


"MSR-000002":{
type:"نیم سکه عادی",
karat:"۹۰۰",
weight:"۴.۰۶۴ گرم"
},


"MSR-000003":{
type:"ربع سکه عادی",
karat:"۹۰۰",
weight:"۲.۰۳۲ گرم"
},


"MSR-000004":{
type:"سکه گرمی عادی",
karat:"۹۰۰",
weight:"۱.۰۱ گرم"
},


"MSR-000005":{
type:"مدال طلای مسروری",
karat:"۷۵۰",
weight:"متغیر"
},


"MSR-000006":{
type:"سکه یادبود مسروری",
karat:"۹۰۰",
weight:"متغیر"
}


};



function checkCoin(){


let code=document.getElementById("codeInput").value.trim();

let result=document.getElementById("result");


if(coins[code]){


let coin=coins[code];


result.style.display="block";


result.innerHTML=`

<h3 style="color:#00ff88">
✓ اصالت تایید شد
</h3>


<div class="item">
نوع سکه: ${coin.type}
</div>


<div class="item">
عیار: ${coin.karat}
</div>


<div class="item">
وزن: ${coin.weight}
</div>


<div class="item">
شماره سریال: ${code}
</div>


<div class="item">
برند: بورس سکه مسروری
</div>


`;

}


else{


result.style.display="block";


result.innerHTML=`

<h3 style="color:red">
✕ سکه یافت نشد
</h3>


<div class="item">
این کد در سامانه ثبت نشده است
</div>

`;

}


}


</script>



</body>

</html>
